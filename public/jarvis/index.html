<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jarvis – Groundwork</title>
    <!-- Adressen /jarvis?listen=1 (t.ex. från en Siri-genväg): skickar vidare till appen, som öppnar Jarvis. -->
    <script>
      location.replace('../?jarvis=1' + (/[?&]listen=/.test(location.search) ? '&listen=1' : ''));
    </script>
    <meta http-equiv="refresh" content="0; url=../?jarvis=1&listen=1" />
  </head>
  <body>
    <p><a href="../?jarvis=1&listen=1">Öppna Jarvis</a></p>
  </body>
</html>
